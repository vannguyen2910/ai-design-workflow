<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Create đến Publish · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1100px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · AI Design Workflow</p>
    <h1>Từ Create đến Publish với GitHub</h1>

    <div class="scroll">
    <svg viewBox="0 0 1100 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="github-flow-title github-flow-desc">
      <title id="github-flow-title">GitHub từ Create đến Publish</title>
      <desc id="github-flow-desc">Swimlane ba làn (Mentee, AI coding tool, GitHub) cho bốn giai đoạn Create, Build, Push, Publish; mentee quyết định công khai thì dùng repo Public và GitHub Pages, không thì repo Private và gửi HTML, PDF hoặc ZIP.</desc>
      <defs>
        <pattern id="github-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#github-flow-dots)" opacity="0.55"/>

      <!-- Lane dividers -->
      <line x1="40" y1="100" x2="1060" y2="100" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="220" x2="1060" y2="220" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="340" x2="1060" y2="340" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="460" x2="1060" y2="460" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <!-- Actor column divider -->
      <line x1="160" y1="100" x2="160" y2="460" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <!-- Stage dividers -->
      <line x1="325" y1="76" x2="325" y2="460" stroke="rgba(45,49,66,0.10)" stroke-width="1" stroke-dasharray="2,4"/>
      <line x1="495" y1="76" x2="495" y2="460" stroke="rgba(45,49,66,0.10)" stroke-width="1" stroke-dasharray="2,4"/>
      <line x1="662" y1="76" x2="662" y2="460" stroke="rgba(45,49,66,0.10)" stroke-width="1" stroke-dasharray="2,4"/>

      <!-- Stage labels -->
      <text x="242" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">CREATE</text>
      <text x="410" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">BUILD</text>
      <text x="578" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">PUSH</text>
      <text x="860" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">PUBLISH</text>

      <!-- Lane labels -->
      <text x="52" y="163" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MENTEE</text>
      <text x="52" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AI CODING TOOL</text>
      <text x="52" y="403" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">GITHUB</text>

      <!-- Arrows (drawn first) -->
      <!-- 1. Tạo repo + clone → Tạo project (Mentee → AI, straight down) -->
      <line x1="240" y1="184" x2="240" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2. Tạo project → Chạy step card (within AI lane) -->
      <line x1="306" y1="280" x2="344" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 3. Chạy step card → Duyệt kết quả (AI → Mentee, straight up) -->
      <line x1="410" y1="256" x2="410" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 4. Duyệt kết quả → Xem danh sách file (within Mentee lane) -->
      <line x1="476" y1="160" x2="514" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 5. Xem danh sách file → Commit + push (Mentee → AI, straight down) -->
      <line x1="580" y1="184" x2="580" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 6. Commit + push → Công khai được? (AI → Mentee, elbow up between columns) -->
      <path d="M 646,280 H 670 Q 678,280 678,272 V 168 Q 678,160 686,160 H 694" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 7. Commit + push → GitHub Pages (upload, dashed) -->
      <path d="M 580,304 V 392 Q 580,400 588,400 H 694" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- 8. Công khai được? → GitHub Pages (nhánh A, accent) -->
      <line x1="760" y1="184" x2="760" y2="376" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 9. Công khai được? → Gửi HTML/PDF/ZIP (nhánh B) -->
      <line x1="826" y1="160" x2="904" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="608" y="380" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="630" y="390" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PUSH</text>

      <rect x="768" y="274" width="70" height="12" rx="2" fill="#f5f5f5"/>
      <text x="803" y="284" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">A · PUBLIC</text>

      <rect x="837" y="138" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="869" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">B · PRIVATE</text>

      <!-- Steps -->
      <!-- Mentee: Tạo repo + clone -->
      <rect x="174" y="136" width="132" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="158" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tạo repo + clone</text>
      <text x="240" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Private · Desktop</text>

      <!-- AI: Tạo project -->
      <rect x="174" y="256" width="132" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="278" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tạo project</text>
      <text x="240" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tạo folder project</text>

      <!-- AI: Chạy step card -->
      <rect x="344" y="256" width="132" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="410" y="278" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Làm việc cùng bạn</text>
      <text x="410" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">theo yêu cầu của bạn</text>

      <!-- Mentee: Duyệt kết quả -->
      <rect x="344" y="136" width="132" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="410" y="158" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Duyệt kết quả</text>
      <text x="410" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sau mỗi bước AI</text>

      <!-- Mentee: Xem danh sách file -->
      <rect x="514" y="136" width="132" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="580" y="158" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Xem danh sách file</text>
      <text x="580" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">chặn file mật</text>

      <!-- AI: Commit + push -->
      <rect x="514" y="256" width="132" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="580" y="278" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Commit + push</text>
      <text x="580" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Lưu và đăng lên</text>

      <!-- Mentee: Công khai được? (focal) -->
      <rect x="694" y="136" width="132" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="760" y="158" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Công khai được?</text>
      <text x="760" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">quyết định của bạn</text>

      <!-- Mentee: Gửi HTML/PDF/ZIP -->
      <rect x="904" y="136" width="132" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="970" y="158" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gửi HTML, PDF, ZIP</text>
      <text x="970" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hoặc mời xem repo</text>

      <!-- GitHub: Pages -->
      <rect x="694" y="376" width="132" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="398" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub Pages</text>
      <text x="760" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">bạn bật · link công khai</text>

      <!-- Legend -->
      <line x1="40" y1="480" x2="1060" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="512" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="520" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Bước</text>

      <rect x="132" y="512" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="152" y="520" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Quyết định không giao cho AI</text>

      <line x1="332" y1="518" x2="360" y2="518" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="368" y="520" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Chuyển giao</text>

      <line x1="468" y1="518" x2="496" y2="518" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="504" y="520" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Đẩy lên GitHub</text>

      <line x1="624" y1="518" x2="652" y2="518" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="660" y="520" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Nhánh công khai (repo Public)</text>
    </svg>
    </div>
  </div>
</body>
</html>
