<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chọn thời gian giao</title>
<!-- Activity "Rule-break hunt" (draft, invented screen). The answer key is in learning/lesson-5-activity-rule-break-hunt.md and is for the instructor only. -->
<style>
/* Starter design system: tokens.
   Use these variables. Do not write raw colours, sizes or fonts anywhere else.
   Every text and interface colour pair below was checked for contrast (text 4.5:1 or more; interface parts 3:1 or more). */
:root {
  /* colour */
  --color-primary: #2D6A4F;
  --color-primary-hover: #1F5139;
  --color-on-primary: #FFFFFF;
  --color-text: #1F1F1F;
  --color-muted: #555555;
  --color-bg: #F7F5F0;
  --color-surface: #FFFFFF;
  --color-border: #D6D1C7;          /* decorative lines only */
  --color-border-strong: #767676;   /* input borders and other interface parts */
  --color-danger: #B3261E;
  --color-danger-bg: #FCEDEA;
  --color-focus: #1D4ED8;
  --color-badge-bg: #DCEFE4;
  --color-badge-text: #1F5139;

  /* spacing (4 px base) */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
  --space-4: 16px; --space-5: 24px; --space-6: 32px;

  /* radius */
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;

  /* type */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.25rem; --text-xl: 1.625rem;
  --weight-regular: 400; --weight-bold: 700;
  --leading: 1.5;

  /* touch target */
  --target-min: 44px;
}

/* Starter design system: components. Built only from the tokens in tokens.css. */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); font-size: var(--text-md); line-height: var(--leading); color: var(--color-text); background: var(--color-bg); }
h1 { font-size: var(--text-xl); line-height: 1.2; margin: 0 0 var(--space-3); }
h2 { font-size: var(--text-lg); line-height: 1.3; margin: 0 0 var(--space-2); }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-primary); }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* layout: one column, readable width; mobile first */
.container { max-width: 480px; margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-6); }
.stack > * + * { margin-top: var(--space-4); }

/* header and navigation: put .skip-link and .app-header above <main id="main">; mark the current page with aria-current="page" */
.skip-link { position: absolute; left: var(--space-2); top: calc(-1 * var(--target-min) - var(--space-4)); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text); }
.skip-link:focus { top: var(--space-2); }
.app-header { background: var(--color-primary); color: var(--color-on-primary); }
.app-header__inner { max-width: 480px; margin: 0 auto; padding: var(--space-2) var(--space-4) 0; }
.app-header__brand { display: inline-flex; align-items: center; min-height: var(--target-min); color: inherit; font-size: var(--text-lg); font-weight: var(--weight-bold); text-decoration: none; }
.nav { display: flex; gap: var(--space-4); padding: 0; margin: 0; list-style: none; overflow-x: auto; }
.nav a { display: inline-flex; align-items: center; min-height: var(--target-min); border-bottom: 4px solid transparent; color: var(--color-on-primary); text-decoration: none; white-space: nowrap; }
.nav a:hover { border-bottom-color: var(--color-badge-bg); }
.nav a[aria-current="page"] { border-bottom-color: var(--color-on-primary); font-weight: var(--weight-bold); }
.app-header :focus-visible { outline-color: var(--color-on-primary); }

/* button: .btn (primary), .btn--secondary */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--target-min); padding: var(--space-2) var(--space-5); border: 2px solid var(--color-primary); border-radius: var(--radius-md); background: var(--color-primary); color: var(--color-on-primary); font: inherit; font-weight: var(--weight-bold); cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.btn--secondary { background: transparent; color: var(--color-primary); }
.btn--secondary:hover { background: var(--color-badge-bg); color: var(--color-primary-hover); }
.btn--block { display: flex; width: 100%; }

/* field: label + input + help or error */
.field { display: grid; gap: var(--space-1); }
.label { font-weight: var(--weight-bold); }
.input { min-height: var(--target-min); padding: var(--space-2) var(--space-3); border: 2px solid var(--color-border-strong); border-radius: var(--radius-sm); background: var(--color-surface); font: inherit; color: var(--color-text); }
.help { color: var(--color-muted); font-size: var(--text-sm); }
.field--error .input { border-color: var(--color-danger); }
.error { color: var(--color-danger); font-size: var(--text-sm); font-weight: var(--weight-bold); }

/* card */
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-4); }

/* radio card: a choice shown as a card (use a real radio input inside a label) */
.radio-card { display: flex; gap: var(--space-3); align-items: flex-start; min-height: var(--target-min); padding: var(--space-3) var(--space-4); border: 2px solid var(--color-border-strong); border-radius: var(--radius-md); background: var(--color-surface); cursor: pointer; }
.radio-card:has(input:checked) { border-color: var(--color-primary); background: var(--color-badge-bg); }
.radio-card:has(input:focus-visible) { outline: 3px solid var(--color-focus); outline-offset: 2px; }
.radio-card input { margin-top: var(--space-1); width: 20px; height: 20px; accent-color: var(--color-primary); }
.radio-card__title { font-weight: var(--weight-bold); display: block; }
.radio-card__detail { color: var(--color-muted); font-size: var(--text-sm); display: block; }

/* badge */
.badge { display: inline-block; padding: var(--space-1) var(--space-3); border-radius: 999px; background: var(--color-badge-bg); color: var(--color-badge-text); font-size: var(--text-sm); font-weight: var(--weight-bold); }

/* alert: .alert (info) and .alert--error */
.alert { padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--color-badge-bg); color: var(--color-badge-text); border-left: 4px solid var(--color-primary); }
.alert--error { background: var(--color-danger-bg); color: var(--color-danger); border-left-color: var(--color-danger); }

/* step indicator */
.steps { display: flex; gap: var(--space-2); padding: 0; margin: 0 0 var(--space-4); list-style: none; font-size: var(--text-sm); color: var(--color-muted); }
.steps li { flex: 1; padding-top: var(--space-2); border-top: 4px solid var(--color-border); }
.steps li[aria-current="step"] { border-top-color: var(--color-primary); color: var(--color-text); font-weight: var(--weight-bold); }
.steps li.done { border-top-color: var(--color-primary); }


/* hunt only: the three planted rule breaks live in the markup below (inline styles and .tabbar), not in the design system */
.tabbar { position: sticky; bottom: 0; display: flex; justify-content: space-around; padding: 10px 0; background: #333333; color: #FFFFFF; font-size: 0.8rem; }
.price { display: flex; justify-content: space-between; align-items: center; }

</style></head>
<body>
<a class="skip-link" href="#main">Bỏ qua, tới nội dung chính</a>
<header class="app-header"><div class="app-header__inner"><a class="app-header__brand" href="#">Delivery App</a>
<nav aria-label="Chính"><ul class="nav"><li><a href="#" aria-current="page">Trang chủ</a></li><li><a href="#">Đơn hàng</a></li><li><a href="#">Cài đặt</a></li></ul></nav></div></header>
<main class="container stack" id="main">
<h1>Chọn thời gian giao</h1>
<ol class="steps"><li class="done">Giỏ hàng</li><li aria-current="step">Giao hàng</li><li>Thanh toán</li></ol>
<label class="radio-card"><input type="radio" name="g"><span><span class="radio-card__title">Giao ngay <span class="badge">Phổ biến</span></span><span class="radio-card__detail">Khoảng 25 đến 35 phút</span></span></label>
<label class="radio-card"><input type="radio" name="g" checked><span><span class="radio-card__title">Hẹn giờ giao</span><span class="radio-card__detail">Chọn khung giờ trong ngày</span></span></label>
<div class="alert">Đơn từ 200.000đ được miễn phí giao.</div>
<div class="price"><span>Giao không tiếp xúc</span>
  <span role="switch" aria-checked="false" tabindex="0" style="display:inline-block;width:44px;height:24px;border-radius:12px;background:#BBBBBB;position:relative"><span style="position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#FFFFFF"></span></span></div>
<a class="btn btn--block" href="#" style="background:#F97316;border-color:#F97316">Tiếp tục</a>
</main>
<div class="tabbar"><span>Trang chủ</span><span>Giỏ hàng</span><span>Tài khoản</span></div>
</body></html>
