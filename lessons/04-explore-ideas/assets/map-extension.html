<!DOCTYPE html>
<html lang="en">
<head>

  <title>Lesson 4 map extension</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #2d3142; padding: 3rem 2rem; }
    .frame { max-width: 760px; margin: 0 auto; }
    .eyebrow { font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 500; margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
    .t { font-size: 14px; fill: #2d3142; }
    .th { font-size: 14px; font-weight: 500; fill: #2d3142; }
    .ts { font-size: 12px; fill: #4f5d75; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: .5; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: .5; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: .5; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: .5; }
    .amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: .5; }
    .gray .th, .gray .ts { fill: #444441; } .gray .ts2 { fill: #5F5E5A; }
    .purple .th, .purple .ts { fill: #3C3489; } .purple .ts2 { fill: #534AB7; }
    .teal .th, .teal .ts { fill: #085041; } .teal .ts2 { fill: #0F6E56; }
    .coral .th, .coral .ts { fill: #712B13; }
    .amber .th { fill: #633806; }
    .ts2 { font-size: 12px; }
    .arr { stroke: #4f5d75; stroke-width: 1.5; fill: none; }
    .leader { stroke: #b4b2a9; stroke-width: .5; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Session design · AI Design Workflow</p>

ine x1="120" y1="178" x2="120" y2="228" class="arr" marker-end="url(#arrow)"/><g class="purple"><rect x="50" y="288" width="140" height="40" rx="8"/><text class="th" x="120.0" y="308.0" text-anchor="middle" dominant-baseline="central">Solution A2</text></g><line x1="120" y1="270" x2="120" y2="286" class="arr" marker-end="url(#arrow)"/><g class="purple"><rect x="270" y="230" width="140" height="40" rx="8"/><text class="th" x="340.0" y="250.0" text-anchor="middle" dominant-baseline="central">Solution B1</text></g><line x1="340" y1="178" x2="340" y2="228" class="arr" marker-end="url(#arrow)"/><g class="purple"><rect x="490" y="230" width="140" height="40" rx="8"/><text class="th" x="560.0" y="250.0" text-anchor="middle" dominant-baseline="central">Solution C1</text></g><line x1="560" y1="178" x2="560" y2="228" class="arr" marker-end="url(#arrow)"/><g class="purple"><rect x="490" y="288" width="140" height="40" rx="8"/><text class="th" x="560.0" y="308.0" text-anchor="middle" dominant-baseline="central">Solution C2</text></g><line x1="560" y1="270" x2="560" y2="286" class="arr" marker-end="url(#arrow)"/><g class="purple"><rect x="490" y="346" width="140" height="40" rx="8"/><text class="th" x="560.0" y="366.0" text-anchor="middle" dominant-baseline="central">Solution C3</text></g><line x1="560" y1="328" x2="560" y2="344" class="arr" marker-end="url(#arrow)"/><text class="ts" x="340" y="400" text-anchor="middle">Gray: Lesson 3, each opportunity traces to an insight ID. Purple: Lesson 4, each solution sits under one opportunity.</text></svg>
