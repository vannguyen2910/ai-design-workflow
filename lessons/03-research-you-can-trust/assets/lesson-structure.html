<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 3 structure · 90-minute session</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #2d3142; padding: 3rem 2rem; }
    .frame { max-width: 760px; margin: 0 auto; }
    .eyebrow { font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 500; margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
    .t { font-size: 14px; fill: #2d3142; }
    .th { font-size: 14px; font-weight: 500; fill: #2d3142; }
    .ts { font-size: 12px; fill: #4f5d75; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: .5; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: .5; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: .5; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: .5; }
    .amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: .5; }
    .gray .th, .gray .ts { fill: #444441; } .gray .ts2 { fill: #5F5E5A; }
    .purple .th, .purple .ts { fill: #3C3489; } .purple .ts2 { fill: #534AB7; }
    .teal .th, .teal .ts { fill: #085041; } .teal .ts2 { fill: #0F6E56; }
    .coral .th, .coral .ts { fill: #712B13; }
    .amber .th { fill: #633806; }
    .ts2 { font-size: 12px; }
    .arr { stroke: #4f5d75; stroke-width: 1.5; fill: none; }
    .leader { stroke: #b4b2a9; stroke-width: .5; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Session design · AI Design Workflow</p>
    <h1>Lesson 3 structure, 90 minutes</h1>
<svg viewBox="0 0 680 634" role="img"><title>Lesson 3 structure, 90 minutes fully allocated</title><desc>Principles and rules sit above a content chain from insights to persona, journey map, opportunity and insight hub. Below, ten timed segments totalling 90 minutes with who acts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="amber"><rect x="40" y="30" width="600" height="34" rx="8"/><text class="th" x="340" y="47" text-anchor="middle" dominant-baseline="central">Principles and rules: AI prompt constraints and designer checks</text></g>
<g class="gray"><rect x="40" y="82" width="104" height="48" rx="8"/><text class="th" x="92" y="99" text-anchor="middle" dominant-baseline="central">Insights</text><text class="ts2" x="92" y="116" text-anchor="middle" dominant-baseline="central">from Lesson 2</text></g>
<g class="purple"><rect x="164" y="82" width="104" height="48" rx="8"/><text class="th" x="216" y="99" text-anchor="middle" dominant-baseline="central">Persona</text><text class="ts2" x="216" y="116" text-anchor="middle" dominant-baseline="central">who</text></g>
<g class="purple"><rect x="288" y="82" width="104" height="48" rx="8"/><text class="th" x="340" y="99" text-anchor="middle" dominant-baseline="central">Journey map</text><text class="ts2" x="340" y="116" text-anchor="middle" dominant-baseline="central">when</text></g>
<g class="purple"><rect x="412" y="82" width="104" height="48" rx="8"/><text class="th" x="464" y="99" text-anchor="middle" dominant-baseline="central">Opportunity</text><text class="ts2" x="464" y="116" text-anchor="middle" dominant-baseline="central">which decision</text></g>
<g class="teal"><rect x="536" y="82" width="104" height="48" rx="8"/><text class="th" x="588" y="99" text-anchor="middle" dominant-baseline="central">Insight hub</text><text class="ts2" x="588" y="116" text-anchor="middle" dominant-baseline="central">keep it</text></g>
<line x1="144" y1="106" x2="162" y2="106" class="arr" marker-end="url(#arrow)"/>
<line x1="268" y1="106" x2="286" y2="106" class="arr" marker-end="url(#arrow)"/>
<line x1="392" y1="106" x2="410" y2="106" class="arr" marker-end="url(#arrow)"/>
<line x1="516" y1="106" x2="534" y2="106" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="154" text-anchor="middle">Gate on every arrow: each line traces to an insight ID</text>
<text class="ts" x="340" y="172" text-anchor="middle">Insights come from interview, competitor, product scope, assumptions</text>
<line x1="40" y1="192" x2="640" y2="192" class="leader"/>
<text class="th" x="40" y="214">Session, 90 min</text>
<text class="th" x="250" y="214">Minutes</text>
<text class="th" x="450" y="214">Who acts</text>
<text class="t" x="40" y="244" dominant-baseline="central">1  Ice breaker</text>
<g class="gray"><rect x="250" y="230" width="48" height="28" rx="4"/><text class="ts" x="274" y="244" text-anchor="middle" dominant-baseline="central">6</text></g>
<text class="ts" x="450" y="244" dominant-baseline="central">No AI</text>
<text class="t" x="40" y="278" dominant-baseline="central">2  Recap: rules, insights</text>
<g class="gray"><rect x="250" y="264" width="40" height="28" rx="4"/><text class="ts" x="270" y="278" text-anchor="middle" dominant-baseline="central">5</text></g>
<text class="ts" x="450" y="278" dominant-baseline="central">No AI, from Lesson 2</text>
<text class="t" x="40" y="312" dominant-baseline="central">3  Persona</text>
<g class="purple"><rect x="250" y="298" width="112" height="28" rx="4"/><text class="ts" x="306" y="312" text-anchor="middle" dominant-baseline="central">14</text></g>
<text class="ts" x="450" y="312" dominant-baseline="central">AI drafts, you check IDs</text>
<text class="t" x="40" y="346" dominant-baseline="central">4  Journey map</text>
<g class="purple"><rect x="250" y="332" width="104" height="28" rx="4"/><text class="ts" x="302" y="346" text-anchor="middle" dominant-baseline="central">13</text></g>
<text class="ts" x="450" y="346" dominant-baseline="central">AI fills cells, you flag gaps</text>
<text class="t" x="40" y="380" dominant-baseline="central">5  Opportunity</text>
<g class="purple"><rect x="250" y="366" width="88" height="28" rx="4"/><text class="ts" x="294" y="380" text-anchor="middle" dominant-baseline="central">11</text></g>
<text class="ts" x="450" y="380" dominant-baseline="central">AI drafts, you rank</text>
<text class="t" x="40" y="414" dominant-baseline="central">6  Activity: insight or not</text>
<g class="coral"><rect x="250" y="400" width="112" height="28" rx="4"/><text class="ts" x="306" y="414" text-anchor="middle" dominant-baseline="central">14</text></g>
<text class="ts" x="450" y="414" dominant-baseline="central">No AI, pairs find the trap</text>
<text class="t" x="40" y="448" dominant-baseline="central">7  Insight hub</text>
<g class="teal"><rect x="250" y="434" width="64" height="28" rx="4"/><text class="ts" x="282" y="448" text-anchor="middle" dominant-baseline="central">8</text></g>
<text class="ts" x="450" y="448" dominant-baseline="central">AI finds, you approve</text>
<text class="t" x="40" y="482" dominant-baseline="central">8  Package into agent</text>
<g class="teal"><rect x="250" y="468" width="48" height="28" rx="4"/><text class="ts" x="274" y="482" text-anchor="middle" dominant-baseline="central">6</text></g>
<text class="ts" x="450" y="482" dominant-baseline="central">You write the step card</text>
<text class="t" x="40" y="516" dominant-baseline="central">9  Q&amp;A, 4 AI questions</text>
<g class="gray"><rect x="250" y="502" width="64" height="28" rx="4"/><text class="ts" x="282" y="516" text-anchor="middle" dominant-baseline="central">8</text></g>
<text class="ts" x="450" y="516" dominant-baseline="central">Cheat sheet</text>
<text class="t" x="40" y="550" dominant-baseline="central">10  Close, home practice</text>
<g class="gray"><rect x="250" y="536" width="40" height="28" rx="4"/><text class="ts" x="270" y="550" text-anchor="middle" dominant-baseline="central">5</text></g>
<text class="ts" x="450" y="550" dominant-baseline="central">Practice runs the full chain</text>
<line x1="40" y1="582" x2="640" y2="582" class="leader"/>
<g class="purple"><rect x="40" y="598" width="12" height="12" rx="2"/></g><text class="ts" x="58" y="604" dominant-baseline="central">Three outputs</text>
<g class="amber"><rect x="170" y="598" width="12" height="12" rx="2"/></g><text class="ts" x="188" y="604" dominant-baseline="central">Rules</text>
<g class="coral"><rect x="250" y="598" width="12" height="12" rx="2"/></g><text class="ts" x="268" y="604" dominant-baseline="central">Activity</text>
<g class="teal"><rect x="350" y="598" width="12" height="12" rx="2"/></g><text class="ts" x="368" y="604" dominant-baseline="central">Keep and reuse</text>
<g class="gray"><rect x="490" y="598" width="12" height="12" rx="2"/></g><text class="ts" x="508" y="604" dominant-baseline="central">Framing and inputs</text>
</svg>
