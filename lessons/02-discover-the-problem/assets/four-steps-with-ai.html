<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bốn bước làm việc với AI · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1100px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · AI Design Workflow</p>
    <h1>Bốn bước làm việc với AI</h1>

    <div class="scroll">
    <svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="four-steps-title four-steps-desc">
      <title id="four-steps-title">Bốn bước làm việc với AI</title>
      <desc id="four-steps-desc">Swimlane hai làn (học viên, AI) cho bốn bước Decision, Evidence, Claim, Challenge; học viên viết quyết định, kiểm tra evidence, chọn và viết lại claim rồi quyết định giữ hay đổi, còn AI rút observation, đề xuất claim và phản biện.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane dividers -->
      <line x1="40" y1="100" x2="1060" y2="100" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="220" x2="1060" y2="220" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="340" x2="1060" y2="340" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="160" y1="100" x2="160" y2="340" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Stage labels -->
      <text x="272" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">1 · DECISION</text>
      <text x="496" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">2 · EVIDENCE</text>
      <text x="720" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">3 · CLAIM</text>
      <text x="944" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">4 · CHALLENGE</text>

      <!-- Lane labels -->
      <text x="52" y="163" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HỌC VIÊN</text>
      <text x="52" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AI</text>

      <!-- Empty cell note -->
      <text x="272" y="284" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AI không viết bước này</text>

      <!-- Arrows (drawn first) -->
      <!-- H1: Decision → AI rút observation -->
      <path d="M 348,160 H 376 Q 384,160 384,168 V 272 Q 384,280 392,280 H 420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- AI observation → học viên kiểm tra -->
      <line x1="496" y1="256" x2="496" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- H2: kiểm tra → AI đề xuất claim -->
      <path d="M 572,160 H 600 Q 608,160 608,168 V 272 Q 608,280 616,280 H 644" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- AI claim → học viên chọn -->
      <line x1="720" y1="256" x2="720" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- H3: chọn claim → AI phản biện -->
      <path d="M 796,160 H 824 Q 832,160 832,168 V 272 Q 832,280 840,280 H 868" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- AI phản biện → học viên quyết định -->
      <line x1="944" y1="256" x2="944" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="392" y="196" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUYẾT ĐỊNH</text>
      <rect x="504" y="226" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="538" y="235" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OBSERVATION</text>
      <rect x="616" y="196" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUOTE ĐÃ DUYỆT</text>
      <rect x="728" y="226" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="750" y="235" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 CLAIM</text>
      <rect x="840" y="196" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="878" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM ĐÃ CHỌN</text>
      <rect x="952" y="226" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="980" y="235" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHẢN BIỆN</text>

      <!-- Học viên steps -->
      <rect x="196" y="136" width="152" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="272" y="158" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gọi tên quyết định</text>
      <text x="272" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">trước khi ai tóm tắt</text>

      <rect x="420" y="136" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="496" y="158" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kiểm tra từng quote</text>
      <text x="496" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">đúng chữ, truy được nguồn</text>

      <rect x="644" y="136" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="158" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chọn, viết lại claim</text>
      <text x="720" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">bằng lời của bạn</text>

      <rect x="868" y="136" width="152" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="944" y="158" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giữ hay đổi claim</text>
      <text x="944" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">giữ ý kiến trái chiều</text>

      <!-- AI steps -->
      <rect x="420" y="256" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="496" y="278" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rút observation</text>
      <text x="496" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">mã · quote · không nói gì</text>

      <rect x="644" y="256" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="278" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đề xuất 3 claim</text>
      <text x="720" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ai · cần gì · quyết định</text>

      <rect x="868" y="256" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="944" y="278" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phản biện claim</text>
      <text x="944" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nói quá · quote sai</text>

      <!-- Legend -->
      <line x1="40" y1="360" x2="1060" y2="360" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="388" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="396" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Bước</text>

      <rect x="132" y="388" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="152" y="396" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Quyết định của học viên, không giao cho AI</text>

      <line x1="412" y1="393" x2="440" y2="393" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="448" y="396" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Chuyển giao</text>
    </svg>
    </div>
  </div>
</body>
</html>
