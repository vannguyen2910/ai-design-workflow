<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#faf8f4;--ink:#1d1b18;--mute:#6b665e;--line:#e4dfd5;--link:#2f5fd0}
@media (prefers-color-scheme:dark){:root{--bg:#15140f;--ink:#f1ede4;--mute:#a39d90;--line:#35322a;--link:#7ba2ff}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 64px}
nav a,main a{color:var(--link)}nav{margin-bottom:24px}
table{border-collapse:collapse;display:block;overflow-x:auto}td,th{border:1px solid var(--line);padding:6px 10px;vertical-align:top}
pre,code{background:rgba(127,127,127,.15);border-radius:4px}code{padding:1px 4px}pre{padding:12px;overflow-x:auto}pre code{background:none}
img{max-width:100%}
</style>
</head>
<body>
<main><nav><a href="index.html">← AI Design Workflow</a></nav><div id="c">Đang tải…</div></main>
<script>
// shortcut: needs http(s), not file://; links between .md files are rewritten to this viewer
const f = new URLSearchParams(location.search).get('f');
const dir = f ? f.replace(/[^/]*$/, '') : '';
fetch(f).then(r => { if (!r.ok) throw new Error(r.status + ' ' + f); return r.text(); }).then(t => {
  t = t.replace(/^---\n[\s\S]*?\n---\n/, '');
  const c = document.getElementById('c');
  c.innerHTML = marked.parse(t);
  c.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (/^(https?:|#|mailto:)/.test(h)) return;
    const u = new URL(h, location.origin + '/' + dir);
    const p = decodeURIComponent(u.pathname.slice(1));
    a.href = /\.md$/.test(p) ? 'viewer.html?f=' + encodeURIComponent(p) + u.hash : p + u.hash;
  });
  c.querySelectorAll('img[src]').forEach(i => {
    const s = i.getAttribute('src');
    if (!/^(https?:|data:)/.test(s)) i.src = new URL(s, location.origin + '/' + dir).pathname;
  });
  document.title = (c.querySelector('h1') || {}).textContent || f;
}).catch(e => { document.getElementById('c').textContent = 'Không mở được: ' + e.message; });
</script>
</body>
</html>
