<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Design Workflow · Student hubs</title>
<style>
  :root { --ink:#111; --bg:#fff; --muted:rgba(17,17,17,.62); --line:rgba(17,17,17,.12); --purple:#6B3FEE; --tint:rgba(107,63,238,.12); --link:#6B3FEE; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f5f4fa; --bg:#111; --muted:rgba(245,244,250,.66); --line:rgba(245,244,250,.16); --tint:rgba(107,63,238,.28); --link:#B7A2FF; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 Helvetica, Arial, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:56px 20px 80px; }
  h1 { font-size:2rem; margin:0 0 6px; }
  p.lede { color:var(--muted); margin:0 0 32px; }
  a.card { display:block; text-decoration:none; color:var(--ink); background:var(--tint); border-radius:14px; padding:16px 20px; margin:10px 0; }
  a.card:hover { outline:2px solid var(--purple); }
  a.card b { display:block; }
  a.card span { color:var(--muted); font-size:.9rem; }
  .empty { color:var(--muted); font-style:italic; }
  footer { margin-top:48px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>AI Design Workflow</h1>
  <p class="lede">Student Experience Hubs. Each hub is one case, with every artifact connected from the business question to the handoff.</p>
  <div id="list"></div>
  <footer>Published with the students' agreement. Each link opens without a login.</footer>
</main>
<script src="hubs.js"></script>
<script>
  var list = document.getElementById("list"), hubs = (window.HUBS || []).filter(function (h) { return h.consent; });
  hubs.sort(function (a, b) { return (b.cohort || "").localeCompare(a.cohort || "") || a.name.localeCompare(b.name); });
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  list.innerHTML = hubs.length ? hubs.map(function (h) {
    return '<a class="card" href="' + (h.url ? esc(h.url) : 'hubs/' + encodeURIComponent(h.slug) + '/index.html') + '"><b>' + esc(h.title) + '</b><span>' + esc(h.name) + (h.cohort ? " · " + esc(h.cohort) : "") + "</span></a>";
  }).join("") : '<p class="empty">No hubs published yet.</p>';
</script>
</body>
</html>
