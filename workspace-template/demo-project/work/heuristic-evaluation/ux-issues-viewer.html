<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Buddy UX issues</title>
<style>
:root{--bg:#fbfaf6;--card:#fff;--ink:#1c1c1a;--muted:#6b6a65;--line:#d9d7cf;--soft:#f1efe8;--accent:#2f6f3e;--s4:#a32d2d;--s3:#d85a30;--s2:#ba7517;--s1:#888780;--shadow:0 6px 24px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#222220;--ink:#ecebe4;--muted:#a8a69d;--line:#3a3935;--soft:#2b2a27;--accent:#7fc08c;--shadow:0 6px 24px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#161614;--card:#222220;--ink:#ecebe4;--muted:#a8a69d;--line:#3a3935;--soft:#2b2a27;--accent:#7fc08c;--shadow:0 6px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:12px;max-width:1180px;margin:0 auto;align-items:start}
@media (max-width:620px){.app{grid-template-columns:1fr}}
.stage-col{min-width:0}
.stage{position:relative;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);padding:16px 0;min-height:420px;overflow:hidden;display:flex;justify-content:center}
.shot{position:relative;width:min(340px,calc((100vh - 150px) * .445));min-width:250px;aspect-ratio:716/1608;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line);user-select:none;-webkit-user-select:none}
.shot img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.shot.placing{cursor:crosshair}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--card);border:3px solid var(--c);color:var(--c);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sel{background:var(--c);color:#fff;transform:scale(1.15);z-index:3}
.pin.edit{cursor:grab}
.pin:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pop{position:absolute;width:min(270px,calc(100% - 16px));background:var(--card);border:2px solid var(--muted);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);z-index:5}
.pop h3{margin:0 0 4px;font-size:14px;font-weight:600}
.pop ul{margin:4px 0 6px;padding-left:18px}
.pop li{margin:2px 0}
.pop .meta{color:var(--muted);font-size:12px}
.pop .x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:18px;line-height:1;color:var(--muted)}
.hint{position:absolute;left:12px;top:10px;right:12px;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;z-index:6}
.nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
.nav button{width:40px;height:40px;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);font-size:20px;line-height:1}
.nav button:disabled{opacity:.35;cursor:default}
.cap{min-width:220px;text-align:center}
.cap b{font-weight:600}
.cap span{display:block;color:var(--muted);font-size:12px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.on{background:var(--ink)}
.panel{border:1.5px solid var(--muted);border-radius:12px;background:var(--card);padding:14px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ph h2{margin:0;font-size:20px;font-weight:500}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:4px 10px;font-size:12px}
.tools button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;background:var(--card);display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:10px;background:var(--soft);padding:8px 10px;margin:0 0 8px}
.item.sel{border-color:var(--c);box-shadow:inset 4px 0 0 var(--c)}
.item .top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.item .top b{color:var(--ink);font-weight:600}
.item .ttl{margin-top:2px;font-weight:500}
.sev{color:#fff;background:var(--c);border-radius:5px;padding:0 6px;font-size:11px;font-weight:600}
.tag{border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11px;color:var(--muted);margin-left:4px}
.list{max-height:calc(100vh - 230px);min-height:200px;overflow:auto;padding-right:2px}
.editor{border:1px dashed var(--muted);border-radius:10px;padding:10px;margin:10px 0}
.editor label{display:block;font-size:12px;color:var(--muted);margin:6px 0 2px}
.editor input,.editor select,.editor textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--card)}
.editor textarea{min-height:72px;resize:vertical}
.editor .row{display:flex;gap:8px}.editor .row>div{flex:1}
.editor .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.editor .btns button{border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:3px 8px;font-size:12px}
.editor .btns .danger{color:var(--s4);border-color:var(--s4)}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(560px,92vw);padding:16px}
dialog textarea{width:100%;height:240px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
dialog .btns button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:5px 12px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<h1 class="sr">Annotated screenshots of Travel Buddy usability issues</h1>
<div class="app">
  <section class="stage-col" aria-label="Screenshots">

    <div class="dots" id="dots"></div>
    <p class="note" style="text-align:center"><a href="../final-prototype/travel-buddy-final-prototype.html" target="_blank" rel="noopener" style="color:var(--accent)">Open the final prototype &#8599;</a></p>
  </section>
  <aside class="panel" aria-label="Issue list">
    <div class="ph"><h2 id="listTitle">List</h2>
      <div class="tools">
        <button id="bEdit" aria-pressed="false">Edit</button>
        <button id="bExport">Export</button>
        <button id="bImport">Import</button>
        <button id="bReset">Reset</button>

  </aside>
</div>

REQEREBERAREQEREBERAREQX031vgthEQEREBYRFB//Z"}], "issues": [{"code": "F8", "title": "'Near Me' shows a preselected destination, even with location set to Never", "severity": 2, "principle": "P1", "status": "new", "desc": "The label says 'Near Chiang Mai' under a 'Near Me' tab, but the destination was preselected, not detected.\nSeen after choosing 'Never' for location in onboarding.", "id": "f8"}, {"code": "F9", "title": "A trip and past journals exist before the traveller made any", "severity": 2, "principle": "P1", "status": "new", "desc": "Plan already holds a Chiang Mai trip with 2 saved tips.\nJournal lists two past trips with saved tips.\nMay be sample data: confirm with the project owner.", "id": "f9"}, {"code": "F10", "title": "Seven screens before the first tip, with only a small shortcut", "severity": 2, "principle": "P7", "status": "new", "desc": "Sign-up, three questions, a welcome, a location question, then Home.\nOnly the first question is required, yet each optional one still takes a screen.\n'Explore without signing up' skips this, but saving and Connect then ask for sign-up.", "id": "f10"}, {"code": "F11", "title": "Capture banner for a trip the traveller never started", "severity": 2, "principle": "P1", "status": "new", "desc": "The banner says 'Capturing your trip to Chiang Mai' with a Pause button.\nIt does not say what is captured or where it is kept.\nNeeds a privacy review outside this check.", "id": "f11"}, {"code": "F12", "title": "Two controls start a new trip with different words", "severity": 1, "principle": "P4", "status": "new", "desc": "'New trip' at the top and '+ Start a new trip' below the list.\nNot clear whether they do the same thing.", "id": "f12"}, {"code": "F13", "title": "Dates disagree between Plan and Journal", "severity": 2, "principle": "P4", "status": "new", "desc": "Plan shows 'Day 1 · Tue 15 Jul'.\nJournal shows the same Chiang Mai trip as 'Mar 12 – 19, 2026', with Days 1, 3 and 5.", "id": "f13"}, {"code": "F1", "title": "Connect has no search or filter", "severity": 4, "principle": "P6, P7", "status": "on record", "desc": "A specific local can only be found by scrolling the list.\nFound in the earlier test round; still true in this prototype.", "id": "f1"}, {"code": "F2", "title": "Share offers only 3 fixed people", "severity": 4, "principle": "P6", "status": "on record", "desc": "No search and no invite by name.\nFound in the earlier test round; still true in this prototype.", "id": "f2"}, {"code": "F3", "title": "Browse mixes people from many cities", "severity": 3, "principle": "P7", "status": "on record", "desc": "People from Chiang Mai and Hanoi are listed together for a Chiang Mai trip.\nThere is no filter by location or trip.", "id": "f3"}, {"code": "F5", "title": "The % match badge is not explained", "severity": 2, "principle": "P2", "status": "on record", "desc": "Badges show 64% to 95% with no reason or source.", "id": "f5"}, {"code": "F7", "title": "'Local resident' label", "severity": 1, "principle": "P2", "status": "on record", "desc": "Tips say 'Local resident · Verified'.\nThe wording was questioned in the earlier test round.", "id": "f7"}], "pins": [{"id": "p1", "issue": "f10", "screen": 0, "x": 50.0, "y": 8.4}, {"id": "p2", "issue": "f8", "screen": 1, "x": 23.5, "y": 7.0}, {"id": "p3", "issue": "f7", "screen": 2, "x": 37.4, "y": 51.6}, {"id": "p4", "issue": "f9", "screen": 3, "x": 50.0, "y": 20.6}, {"id": "p5", "issue": "f12", "screen": 3, "x": 80.2, "y": 7.9}, {"id": "p6", "issue": "f12", "screen": 3, "x": 50.0, "y": 30.6}, {"id": "p7", "issue": "f13", "screen": 4, "x": 20.7, "y": 18.7}, {"id": "p8", "issue": "f1", "screen": 5, "x": 84.9, "y": 7.5}, {"id": "p9", "issue": "f5", "screen": 5, "x": 36.0, "y": 23.3}, {"id": "p10", "issue": "f3", "screen": 5, "x": 19.3, "y": 68.5}, {"id": "p11", "issue": "f11", "screen": 6, "x": 50.0, "y": 17.1}, {"id": "p12", "issue": "f9", "screen": 6, "x": 50.0, "y": 46.6}, {"id": "p13", "issue": "f13", "screen": 6, "x": 47.2, "y": 32.0}, {"id": "p14", "issue": "f2", "screen": 7, "x": 50.0, "y": 75.2}, {"id": "p15", "issue": "f13", "screen": 7, "x": 18.9, "y": 22.0}]};
const KEY = 'travel-buddy-ux-viewer-v1';
const SEV_NAME = {4:'Catastrophe',3:'Major',2:'Minor',1:'Cosmetic',0:'Not a problem'};
const SEV_COL = {4:'var(--s4)',3:'var(--s3)',2:'var(--s2)',1:'var(--s1)',0:'var(--s1)'};
const clone = o => JSON.parse(JSON.stringify(o));
let state = clone({issues: DATA.issues, pins: DATA.pins});
let saveOk = true;
try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === DATA.v && s.issues && s.pins) state = s; } } catch (e) { saveOk = false; }
let cur = 0, selected = null, edit = false, filt = new Set(), placing = null, seq = 1;
state.issues.forEach(i => { const m = /^NEW-(\d+)$/.exec(i.code); if (m) seq = Math.max(seq, +m[1] + 1); });
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const issue = id => state.issues.find(i => i.id === id);
const label = i => String(i.code).replace(/^F/, '');

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({v: DATA.v, issues: state.issues, pins: state.pins})); saveOk = true; } catch (e) { saveOk = false; }
  note();
}
function note() {
  $('saveNote').textContent = saveOk ? (edit ? 'Edits are saved in this browser. Use Export to keep them in the project.' : '') : 'This browser cannot save edits. Use Export to keep them.';
}
function visible(i) { return !filt.size || filt.has(i.severity); }

function renderChips() {
  const counts = {}; state.issues.forEach(i => counts[i.severity] = (counts[i.severity] || 0) + 1);
  $('chips').innerHTML = [4,3,2,1].map(s => `<button class="chip${filt.has(s) ? ' on' : ''}" style="--c:${SEV_COL[s]}" data-s="${s}"><i></i>Sev ${s} · ${counts[s] || 0}</button>`).join('') +
    (filt.size ? '<button class="chip" data-s="all">Clear</button>' : '');
}
function renderList() {
  const items = state.issues.filter(visible).sort((a, b) => b.severity - a.severity || String(a.code).localeCompare(String(b.code), undefined, {numeric: true}));
  $('listTitle').textContent = 'List (' + (filt.size ? items.length + ' of ' + state.issues.length : state.issues.length) + ')';
  $('list').innerHTML = items.map(i => `<button class="item${i.id === selected ? ' sel' : ''}" style="--c:${SEV_COL[i.severity]}" data-id="${esc(i.id)}">
    <div class="top"><span><b>${esc(i.code)}</b> · <span class="sev">${i.severity}</span> ${SEV_NAME[i.severity] || ''}</span><span>${esc(i.principle || '')}<span class="tag">${esc(i.status || '')}</span></span></div>
    <div class="ttl">${esc(i.title)}</div></button>`).join('') || '<p class="note">No issues match this filter.</p>';
}
function renderShot() {
  const sc = DATA.screens[cur];
  $('img').src = sc.img; $('img').alt = sc.title;
  const here = state.pins.filter(p => p.screen === cur && issue(p.issue) && visible(issue(p.issue)));
  $('pins').innerHTML = here.map(p => { const i = issue(p.issue); return `<button class="pin${p.issue === selected ? ' sel' : ''}${edit ? ' edit' : ''}" data-pin="${esc(p.id)}" style="--c:${SEV_COL[i.severity]};left:${p.x}%;top:${p.y}%" aria-label="${esc(i.code + ': ' + i.title)}">${esc(label(i))}</button>`; }).join('');
  const n = state.pins.filter(p => p.screen === cur).map(p => p.issue).filter((v, k, a) => a.indexOf(v) === k).length;
  $('cap').innerHTML = `<b>${esc(sc.title)}</b><span>${cur + 1} of ${DATA.screens.length} · ${n} issue${n === 1 ? '' : 's'}</span>`;
  $('prev').disabled = cur === 0; $('next').disabled = cur === DATA.screens.length - 1;
  $('dots').innerHTML = DATA.screens.map((s, k) => `<i class="${k === cur ? 'on' : ''}" data-k="${k}" title="${esc(s.title)}"></i>`).join('');
  $('shot').classList.toggle('placing', !!placing);
  renderPop();
}
function renderPop() {
  const pop = $('pop'); const sel = selected && issue(selected);
  const pin = sel && visible(sel) && state.pins.find(p => p.issue === selected && p.screen === cur);
  if (!sel || !pin || edit) { pop.hidden = true; return; }
  const lines = String(sel.desc || '').split('\n').filter(Boolean);
  pop.innerHTML = `<button class="x" aria-label="Close" data-close="1">&times;</button><h3>${esc(sel.code)} issue: ${esc(sel.title)}</h3><ul>${lines.map(l => '<li>' + esc(l) + '</li>').join('')}</ul><div class="meta">Severity ${sel.severity} · ${SEV_NAME[sel.severity] || ''} · ${esc(sel.principle || '')} · ${esc(sel.status || '')}</div>`;
  pop.hidden = false;
  const st = $('stage').getBoundingClientRect(), sh = $('shot').getBoundingClientRect();
  const px = sh.left - st.left + sh.width * pin.x / 100, py = sh.top - st.top + sh.height * pin.y / 100;
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(Math.max(8, px - w / 2), st.width - w - 8);
  let top = py + 20; if (top + h > st.height - 8) top = Math.max(8, py - h - 20);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
function renderEditor() {
  const el = $('editor'); const i = selected && issue(selected);
  if (!edit) { el.innerHTML = ''; return; }
  if (!i) { el.innerHTML = '<div class="editor"><div class="btns"><button data-act="new">New issue</button></div><p class="note">Select an issue in the list to edit it, drag pins to move them, or add a new issue and click the screenshot to place its pin.</p></div>'; return; }
  el.innerHTML = `<div class="editor"><label>Title</label><input id="eTitle" value="${esc(i.title)}">
    <label>Description (one bullet per line)</label><textarea id="eDesc">${esc(i.desc)}</textarea>
    <div class="row"><div><label>Severity</label><select id="eSev">${[4,3,2,1,0].map(s => `<option value="${s}"${s === i.severity ? ' selected' : ''}>${s} · ${SEV_NAME[s]}</option>`).join('')}</select></div>
    <div><label>Principle</label><input id="ePri" value="${esc(i.principle)}"></div></div>
    <div class="row"><div><label>Code</label><input id="eCode" value="${esc(i.code)}"></div>
    <div><label>Status</label><select id="eStat">${['new','on record'].map(s => `<option${s === i.status ? ' selected' : ''}>${s}</option>`).join('')}</select></div></div>
    <div class="btns"><button data-act="new">New issue</button><button data-act="addpin">Add another pin</button><button data-act="delpin" class="danger">Delete pin on this screen</button><button data-act="delissue" class="danger">Delete issue</button></div></div>`;
}
function renderAll() { renderChips(); renderList(); renderShot(); renderEditor(); note(); }
function select(id, jump) {
  selected = id;
  if (jump) { const p = state.pins.find(p => p.issue === id); if (p) cur = p.screen; }
  renderAll();
}
function setHint(t) { const h = $('hint'); h.hidden = !t; h.textContent = t || ''; }

$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-s]'); if (!b) return;
  if (b.dataset.s === 'all') filt.clear(); else { const s = +b.dataset.s; filt.has(s) ? filt.delete(s) : filt.add(s); }
  renderAll();
});
$('list').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) select(b.dataset.id, true); });
$('dots').addEventListener('click', e => { const k = e.target.dataset.k; if (k != null) { cur = +k; renderAll(); } });
$('prev').onclick = () => { if (cur > 0) { cur--; renderAll(); } };
$('next').onclick = () => { if (cur < DATA.screens.length - 1) { cur++; renderAll(); } };
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') $('prev').click(); if (e.key === 'ArrowRight') $('next').click();
  if (e.key === 'Escape') { placing = null; setHint(''); selected = null; renderAll(); }
});
$('pop').addEventListener('click', e => { if (e.target.dataset.close) { selected = null; renderAll(); } });

let drag = null;
$('pins').addEventListener('pointerdown', e => {
  const b = e.target.closest('.pin'); if (!b) return;
  const p = state.pins.find(p => p.id === b.dataset.pin);
  if (edit) { drag = {id: p.id, moved: false}; b.setPointerCapture(e.pointerId); }
});
$('pins').addEventListener('pointermove', e => {
  if (!drag) return;
  const r = $('shot').getBoundingClientRect(); const p = state.pins.find(p => p.id === drag.id);
  p.x = Math.round(Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100)) * 10) / 10;
  p.y = Math.round(Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100)) * 10) / 10;
  drag.moved = true;
  const el = e.target.closest('.pin'); if (el) { el.style.left = p.x + '%'; el.style.top = p.y + '%'; }
});
$('pins').addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null;
  if (d.moved) { save(); }
});
$('pins').addEventListener('click', e => {
  const b = e.target.closest('.pin'); if (!b) return;
  const p = state.pins.find(p => p.id === b.dataset.pin);
  selected = selected === p.issue && !edit ? null : p.issue; renderAll();
});
$('shot').addEventListener('click', e => {
  if (!placing || e.target.closest('.pin')) return;
  const r = $('shot').getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) / r.width * 1000) / 10, y = Math.round((e.clientY - r.top) / r.height * 1000) / 10;
  if (placing.type === 'new') {
    const id = 'new-' + Date.now(); const code = 'NEW-' + seq++;
    state.issues.push({id, code, title: 'New issue', desc: 'Describe what was seen.', severity: 2, principle: '', status: 'new'});
    state.pins.push({id: 'p-' + Date.now(), issue: id, screen: cur, x, y}); selected = id;
  } else {
    state.pins.push({id: 'p-' + Date.now(), issue: placing.issue, screen: cur, x, y});
  }
  placing = null; setHint(''); renderAll(); save();
});

$('editor').addEventListener('input', e => {
  const i = issue(selected); if (!i) return;
  const map = {eTitle: 'title', eDesc: 'desc', ePri: 'principle', eCode: 'code'};
  if (map[e.target.id]) { i[map[e.target.id]] = e.target.value; renderChips(); renderList(); renderShot(); save(); }
});
$('editor').addEventListener('change', e => {
  const i = issue(selected); if (!i) return;
  if (e.target.id === 'eSev') i.severity = +e.target.value;
  if (e.target.id === 'eStat') i.status = e.target.value;
  renderAll(); save();
});
$('editor').addEventListener('click', e => {
  const a = e.target.dataset.act; if (!a) return;
  if (a === 'new') { placing = {type: 'new'}; setHint('Click the screenshot to place the pin for the new issue. Esc to cancel.'); renderShot(); }
  if (a === 'addpin') { placing = {type: 'pin', issue: selected}; setHint('Click the screenshot to add another pin for ' + issue(selected).code + '. Esc to cancel.'); renderShot(); }
  if (a === 'delpin') { const k = state.pins.findIndex(p => p.issue === selected && p.screen === cur); if (k >= 0) state.pins.splice(k, 1); renderAll(); save(); }
  if (a === 'delissue') { if (confirm('Delete ' + issue(selected).code + ' and all its pins?')) { state.pins = state.pins.filter(p => p.issue !== selected); state.issues = state.issues.filter(i => i.id !== selected); selected = null; renderAll(); save(); } }
});

$('bEdit').onclick = () => { edit = !edit; placing = null; setHint(''); $('bEdit').classList.toggle('on', edit); $('bEdit').setAttribute('aria-pressed', edit); renderAll(); };

function dialog(title, note, text, buttons) {
  $('dTitle').textContent = title; $('dNote').textContent = note; $('dText').value = text;
  $('dBtns').innerHTML = ''; buttons.forEach(b => { const x = document.createElement('button'); x.textContent = b[0]; x.onclick = () => b[1](x); $('dBtns').appendChild(x); });
  $('dText').readOnly = !buttons.some(b => b[0] === 'Apply'); try { $('dlg').showModal(); } catch (e) { $('dlg').setAttribute('open', ''); }
}
const closeDlg = () => { try { $('dlg').close(); } catch (e) { $('dlg').removeAttribute('open'); } };
$('bExport').onclick = () => {
  const json = JSON.stringify({version: 1, issues: state.issues, pins: state.pins}, null, 2);
  dialog('Export', 'Copy this JSON or download it, then send it back so the project files can be updated.', json, [
    ['Copy', x => { $('dText').select(); try { document.execCommand('copy'); x.textContent = 'Copied'; } catch (e) {} }],
    ['Download', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], {type: 'application/json'})); a.download = 'travel-buddy-ux-issues.json'; a.click(); }],
    ['Close', closeDlg]]);
};
$('bImport').onclick = () => dialog('Import', 'Paste exported JSON here. It replaces the issues and pins you see now.', '', [
  ['Apply', () => { try { const s = JSON.parse($('dText').value); if (!s.issues || !s.pins) throw 0; state = {issues: s.issues, pins: s.pins}; selected = null; closeDlg(); renderAll(); save(); } catch (e) { $('dNote').textContent = 'That is not valid exported JSON.'; } }],
  ['Cancel', closeDlg]]);
$('bReset').onclick = () => { if (confirm('Discard your edits and restore the original issues?')) { state = clone({issues: DATA.issues, pins: DATA.pins}); selected = null; try { localStorage.removeItem(KEY); } catch (e) {} renderAll(); } };
window.addEventListener('resize', renderPop);
renderAll();
</script>
</body>
</html>
